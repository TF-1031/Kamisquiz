<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kami’s Quiz</title>

  <!-- Link to your local CSS -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Optional favicon -->
  <link rel="icon" href="data:," />
</head>
<body>
  <header>
    <h1>Kami’s Quiz</h1>
  </header>

  <main>
    <section id="quiz-container">
      <div id="question-box">
        <h2 id="question-text">Press Start to begin!</h2>
      </div>

      <div id="options"></div>

      <div id="controls">
        <button id="start-btn">Start Quiz</button>
        <button id="next-btn" disabled>Next Question</button>
      </div>

      <div id="score-box">
        <p id="score-text"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Kami’s Quiz — powered by NAMS study practice.</p>
  </footer>

  <!-- Link to your JavaScript -->
  <script src="./Script.js"></script>
</body>
</html>
